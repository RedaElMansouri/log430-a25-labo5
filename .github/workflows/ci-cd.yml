name: CI-CD

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Run tests (CI)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env for app
        run: |
          cat > .env <<'EOF'
          DB_HOST=mysql
          DB_PORT=3306
          DB_NAME=labo03_db
          DB_USER=labo03
          DB_PASS=labo03
          REDIS_HOST=redis
          REDIS_PORT=6379
          REDIS_DB=0
          EOF

      - name: Create external Docker network (if missing)
        run: docker network create labo03-network || true

      - name: Build and start services
        run: docker compose up -d --build

      - name: Wait for services to be ready
        run: |
          echo "Waiting for MySQL init..."
          sleep 25
          docker compose ps

      - name: Run tests inside app container
        run: docker compose exec -T -e PYTHONPATH=/app/src -w /app/src store_manager pytest -q

      - name: Show service logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color mysql | tail -n 200 || true
          docker compose logs --no-color redis | tail -n 200 || true
          docker compose logs --no-color store_manager | tail -n 200 || true

  deploy:
    name: Deploy to server (CD)
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy project to server (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: |
            docker-compose.yml
            Dockerfile
            requirements.txt
            db-init/**
            src/**
          target: ~/log430-a25-labo3
          overwrite: true

      - name: Deploy via SSH (Docker Compose up)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -euo pipefail
            sudo sh -lc 'command -v docker >/dev/null 2>&1 || curl -fsSL https://get.docker.com | sh'
            sudo usermod -aG docker $USER || true
            mkdir -p ~/log430-a25-labo3
            cd ~/log430-a25-labo3
            sudo docker network create labo03-network || true
            cat > .env <<'EOF'
            DB_HOST=mysql
            DB_PORT=3306
            DB_NAME=labo03_db
            DB_USER=labo03
            DB_PASS=labo03
            REDIS_HOST=redis
            REDIS_PORT=6379
            REDIS_DB=0
            EOF
            sudo docker compose up -d --build
            sudo docker compose ps
            # health check with retries
            for i in 1 2 3; do
              sleep 5
              if curl -sS http://localhost:5001/health-check | grep -q ok; then
                echo "health-check ok"
                exit 0
              fi
            done
            echo "health-check failed" && sudo docker compose logs --no-color || true
